<table>

    <tr>
        <th>Name</th>
        <th>Category</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Brand</th>
        <th>Description</th>
    </tr>

    {for product in product }

    <tr>
        <td> {{ product.name }} </td>
        <td> {{ product.category }} </td>
        <td> {{ product.price }} </td>
        <td> {{ product.quantity }} </td>
        <td> {{ product.brand }} </td>
        <td> {{ product.description }} </td>
    </tr>

    {end for}




</table>
